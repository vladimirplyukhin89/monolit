# Стейджинг / preview. Прод — Beget (см. docs/architecture/deploy.md).
# Адаптер Astro и Functions здесь не используются.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Не задавать SMTP_*, TELEGRAM_*, MAX_* — заявки на Netlify не обрабатываются.
  PUBLIC_CALLIBRI_ENABLED = "false"
  PUBLIC_INDEXING_ENABLED = "false"

# Deploy Preview и branch deploy: canonical/sitemap берут DEPLOY_PRIME_URL в astro.config.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
